stages:
  - test
  - publish

mcp-at-scale:typescript-sdk:test:
  stage: test
  image: node:25
  rules:
    - if: $CI_COMMIT_TAG =~ /^typescript-sdk/
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  script:
  - cd mcp-at-scale/typescript-sdk
  - npm ci
  - npm run lint
  - npm run test

mcp-at-scale:typescript-sdk:publish-npm:
  stage: publish
  image: node:25
  rules:
    - if: $CI_COMMIT_TAG =~ /^typescript-sdk/
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cd mcp-at-scale/typescript-sdk
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#typescript-sdk/}"
      else
        BASE_VERSION=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
        HASH=$(echo $CI_COMMIT_SHA | cut -c1-7)
        VERSION="${BASE_VERSION}.${CI_PIPELINE_IID}-${HASH}"
      fi
      echo "Publishing version $VERSION"
    - npm version $VERSION --no-git-tag-version
    - echo "//cicd.skyway.porsche.com/api/v4/projects/$CI_PROJECT_ID/packages/npm/:_authToken=${CI_JOB_TOKEN}" > .npmrc
    - npm config set @mcporsche:registry https://cicd.skyway.porsche.com/api/v4/projects/$CI_PROJECT_ID/packages/npm/
    - npm ci
    - npm run build
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        npm publish
      else
        npm publish --tag dev
      fi
