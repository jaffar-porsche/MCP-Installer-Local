services:
  jira-mcp:
    build:
      context: .
      dockerfile: jira-mcp/Dockerfile
    container_name: mcporsche-jira-mcp
    ports:
      - "${JIRA_MCP_PORT:-8000}:${JIRA_MCP_PORT:-8000}"
    environment:
      - PORT=${JIRA_MCP_PORT:-8000}
      - JIRA_PAT=${JIRA_PAT}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-https://api.skyway.porsche.com/jira}
      - HTTP_PROXY=${HTTP_PROXY:-http://http-proxy.porsche.org:3128}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://http-proxy.porsche.org:3133}
      # Certificate authentication (optional - uncomment to enable)
      # When enabled, proxy settings are ignored for authenticated requests
      - CERT_PATH=${JIRA_CERT_PATH:-}
      - CERT_PASSWORD=${JIRA_CERT_PASSWORD:-}
    # Uncomment to mount certificate file when using certificate auth
    # volumes:
    #   - ${JIRA_CERT_PATH}:/app/certs/certificate.p12:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$$PORT/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcporsche-network

  confluence-mcp:
    build:
      context: .
      dockerfile: confluence-mcp/Dockerfile
    container_name: mcporsche-confluence-mcp
    ports:
      - "${CONFLUENCE_MCP_PORT:-8001}:${CONFLUENCE_MCP_PORT:-8001}"
    environment:
      - PORT=${CONFLUENCE_MCP_PORT:-8001}
      - CONFLUENCE_PAT=${CONFLUENCE_PAT}
      - CONFLUENCE_BASE_URL=${CONFLUENCE_BASE_URL:-https://api.skyway.porsche.com/confluence}
      - CONFLUENCE_HOME_SPACE=${CONFLUENCE_HOME_SPACE}
      - HTTP_PROXY=${HTTP_PROXY:-http://http-proxy.porsche.org:3128}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://http-proxy.porsche.org:3133}
      # Certificate authentication (optional - uncomment to enable)
      # When enabled, proxy settings are ignored for authenticated requests
      - CERT_PATH=${CONFLUENCE_CERT_PATH:-}
      - CERT_PASSWORD=${CONFLUENCE_CERT_PASSWORD:-}
    # Uncomment to mount certificate file when using certificate auth
    # volumes:
    #   - ${CONFLUENCE_CERT_PATH}:/app/certs/certificate.p12:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$$PORT/docs || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcporsche-network

  confluence-vw-mcp:
    build:
      context: .
      dockerfile: confluence-mcp/Dockerfile
    container_name: mcporsche-confluence-vw-mcp
    ports:
      - "${CONFLUENCE_VW_MCP_PORT:-8009}:${CONFLUENCE_VW_MCP_PORT:-8009}"
    environment:
      - PORT=${CONFLUENCE_VW_MCP_PORT:-8009}
      - CONFLUENCE_PAT=${CONFLUENCE_VW_PAT}
      - CONFLUENCE_BASE_URL=${CONFLUENCE_VW_BASE_URL:-https://devstack.vwgroup.com/confluence}
      - CONFLUENCE_HOME_SPACE=${CONFLUENCE_VW_HOME_SPACE:-}
      - SSL_VERIFY=${CONFLUENCE_VW_SSL_VERIFY:-false}
      # No proxy for VW instance by default
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$$PORT/docs || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcporsche-network

  gitlab-mcp:
    build:
      context: .
      dockerfile: gitlab-mcp/Dockerfile
    container_name: mcporsche-gitlab-mcp
    ports:
      - "${GITLAB_MCP_PORT:-8003}:${GITLAB_MCP_PORT:-8003}"
    environment:
      - PORT=${GITLAB_MCP_PORT:-8003}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://cicd.skyway.porsche.com}
      - HTTP_PROXY=${HTTP_PROXY:-http://http-proxy.porsche.org:3128}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://http-proxy.porsche.org:3133}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$$PORT/docs || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcporsche-network

  glossary-mcp:
    build:
      context: ./glossary-mcp
      dockerfile: Dockerfile
    container_name: mcporsche-glossary-mcp
    ports:
      - "${GLOSSARY_MCP_PORT:-8002}:${GLOSSARY_MCP_PORT:-8002}"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=${GLOSSARY_MCP_PORT:-8002}
      - HTTP_PROXY=${HTTP_PROXY:-http://http-proxy.porsche.org:3128}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://http-proxy.porsche.org:3133}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$$MCP_PORT/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcporsche-network

networks:
  mcporsche-network:
    driver: bridge
    name: mcporsche-mcp-network