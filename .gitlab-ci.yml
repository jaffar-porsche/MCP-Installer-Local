stages:
- test
- release
- trigger

# Jira MCP tests
test:jira-mcp:
  stage: test
  image: python:3.14-alpine
  rules:
  - changes:
      - jira-mcp/**/*
  before_script:
    - cd jira-mcp
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: jira-mcp/report.xml

# Confluence MCP tests
test:confluence-mcp:
  stage: test
  image: python:3.14-alpine
  rules:
  - changes:
      - confluence-mcp/**/*
  before_script:
    - cd confluence-mcp
    - pip install --no-cache-dir -r requirements.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: confluence-mcp/report.xml

# Semantic versioning: create git tags from conventional commits
release:version-tag:
  stage: release
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache git
    - git fetch --tags
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@cicd.skyway.porsche.com/${CI_PROJECT_PATH}.git"
  script:
    - |
      TAGS_CREATED=""

      for SERVICE in jira-mcp confluence-mcp; do
        LATEST_TAG=$(git tag -l "${SERVICE}-v*" --sort=-v:refname | head -1)

        if [ -z "$LATEST_TAG" ]; then
          echo "No tag found for ${SERVICE}, creating initial v0.1.0"
          git tag "${SERVICE}-v0.1.0"
          git push origin "${SERVICE}-v0.1.0"
          TAGS_CREATED="${TAGS_CREATED} ${SERVICE}-v0.1.0"
          continue
        fi

        CURRENT=$(echo "$LATEST_TAG" | sed "s/${SERVICE}-v//")
        MAJOR=$(echo "$CURRENT" | cut -d. -f1)
        MINOR=$(echo "$CURRENT" | cut -d. -f2)
        PATCH=$(echo "$CURRENT" | cut -d. -f3)

        # Commits touching service files or with service scope
        FILE_COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" -- "${SERVICE}/")
        SCOPE_COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" | grep -iE "^\w+\(${SERVICE}\)" || true)
        RELEVANT=$(printf "%s\n%s" "$FILE_COMMITS" "$SCOPE_COMMITS" | sort -u | grep -v '^$' || true)

        if [ -z "$RELEVANT" ]; then
          echo "No changes for ${SERVICE} since ${LATEST_TAG}, skipping"
          continue
        fi

        echo "Relevant commits for ${SERVICE} since ${LATEST_TAG}:"
        echo "$RELEVANT"

        BUMP="patch"
        echo "$RELEVANT" | grep -qE '^feat' && BUMP="minor"
        echo "$RELEVANT" | grep -qE '(^[a-z]+!(\(|:)|BREAKING CHANGE)' && BUMP="major"

        case "$BUMP" in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          patch) PATCH=$((PATCH + 1)) ;;
        esac

        NEW_TAG="${SERVICE}-v${MAJOR}.${MINOR}.${PATCH}"
        echo "${SERVICE}: ${CURRENT} -> ${MAJOR}.${MINOR}.${PATCH} (${BUMP} bump)"

        git tag "$NEW_TAG"
        git push origin "$NEW_TAG"
        TAGS_CREATED="${TAGS_CREATED} ${NEW_TAG}"
      done

      echo "Created tags:${TAGS_CREATED:-" (none)"}"

trigger:mcp-at-scale:
  stage: trigger
  rules:
  - if: $CI_COMMIT_TAG =~ /^typescript-sdk/
  - changes:
      - mcp-at-scale/**/*
  trigger:
    include: mcp-at-scale/.gitlab-ci.yml
    strategy: mirror
