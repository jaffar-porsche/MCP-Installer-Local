name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder needs `write` on contents to attach the .exe to the release.
permissions:
  contents: write

jobs:
  release:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: deliverable-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: deliverable-electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build + publish installer
        # electron-builder reads the tag name and uploads the resulting
        # `dist\MCPorsche-Setup-<version>.exe` to the GitHub Release
        # created by this workflow run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If you have a code-signing cert, set these as repo secrets:
          # CSC_LINK: base64-encoded .pfx
          # CSC_KEY_PASSWORD: pfx password
        run: npm run build:win -- --publish always

      - name: Upload artifact (in case release publish failed)
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MCPorsche-Setup
          path: deliverable-electron/dist/*.exe
          retention-days: 14
